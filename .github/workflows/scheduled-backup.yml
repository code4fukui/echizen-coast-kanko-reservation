name: Scheduled 

on:
  workflow_dispatch:
  schedule:
    # 3:31分に実行 3(JST)-9+24=18(UTC)
    - cron: '31 18 * * *'

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.9.0
      - name: Setup
        run: |
          echo "${{ secrets.CLIENT_CERT }}" > client.crt
          echo "${{ secrets.CLIENT_KEY }}" > client.key
      - name: make
        run: |
          deno run -A -r update.js ${{ secrets.domain }} ${{ secrets.get_latest_hotel_api }} ${{ secrets.get_latest_rsv_sum_api }} client.key client.crt
      - name: cleanup
        run: |
          rm -f client.key client.crt
      - name: commit and push
        run: |
          git config --global user.email "workflow@example.com"
          git config --global user.name "workflow user"
          git add .
          git commit -m 'update data' && git push ${REPO} HEAD:${{github.event.pull_request.head.ref}} || true
          git push
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl --fail -X POST -H 'Content-type: application/json' \
          --data '{
            "attachments": [
              {
                "color": "#E01E5A",
                "title": "【越前海岸エリア】データ更新に失敗しました。",
                "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "fields": [
                  {
                    "title": "ワークフロー",
                    "value": "${{ github.workflow }}",
                    "short": true
                  },
                  {
                    "title": "ジョブ",
                    "value": "${{ github.job }}",
                    "short": true
                  }
                ],
                "text": "GitHub Actionsの実行中にエラーが発生しました。至急ログを確認してください。"
              }
            ]
          }' \
          ${{ secrets.SLACK_WEBHOOK }}
